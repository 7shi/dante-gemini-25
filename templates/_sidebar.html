<aside class="sidebar">
    <div class="sidebar-title"><a href="{{ base }}index.html">La Divina Commedia</a></div>

    {% for part in sidebar_parts %}
    <section class="sidebar-section">
        <h2><a href="{{ base }}{{ part.summary_href }}"{% if current_part is defined and current_part == part.key and current_canto is not defined %} class="active"{% endif %}>{{ part.label }}</a></h2>
        <ul class="link-row canto-row">
            {% for canto in part.cantos %}
            <li><a href="{{ base }}{{ canto.href }}" title="{{ canto.title }}"{% if current_part is defined and current_part == part.key and current_canto is defined and current_canto == canto.number %} class="active"{% endif %}>{{ canto.number }}</a></li>
            {% endfor %}
        </ul>
    </section>
    {% endfor %}
</aside>
